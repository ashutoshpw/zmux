name: Local zellij public peer feasibility

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-zellij-feasibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-public-peer:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Compile public SDK fixture and exercise the pinned real owner
        run: python3 -B tools/local-zellij-feasibility/run.py --output "$RUNNER_TEMP/local-zellij-feasibility"
      - name: Upload bounded host evidence and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-zellij-public-peer-macos-${{ runner.arch }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/local-zellij-feasibility/receipt.json
            ${{ runner.temp }}/local-zellij-feasibility/*.log
            tools/local-zellij-feasibility/NOTICE.md
            tools/local-zellij-feasibility/licenses/Zellij-LICENSE
          if-no-files-found: error
          retention-days: 7
