name: Claude notification integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned Rust
        run: rustup toolchain install 1.95.0 --profile minimal --target aarch64-apple-darwin
      - name: Verify shared local notification owner
        run: cargo test --locked -p zmux-desktop-runtime --test native_notifications plain_claude_completion_reaches_background_attention_while_provider_is_alive
      - name: Build installable host app
        run: scripts/build-macos-dev --architecture host
      - name: Verify native sidebar, attention and status menu
        run: scripts/check-native-sidebar
      - name: Verify authenticated SSH completion and cleanup
        run: |
          python3 -B tools/claude-notification-acceptance/run.py \
            --library dist/zmux.app/Contents/Frameworks/libzmux_native_bridge.dylib \
            --cli dist/zmux.app/Contents/Resources/bin/zmux > dist/claude-ssh-receipt.json
      - name: Upload tested macOS development build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zmux-claude-notifications-${{ github.sha }}
          path: |
            dist/zmux-dev-arm64-*.zip
            dist/*.sha256
            dist/build-info.json
            dist/claude-ssh-receipt.json
            dist/native-sidebar*
          if-no-files-found: error
          retention-days: 7
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zmux-claude-diagnostics-${{ github.sha }}
          path: |
            dist/*.json
            dist/*.log
            dist/*.png
          if-no-files-found: warn
          retention-days: 7
