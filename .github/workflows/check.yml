name: Foundation checks

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'apps/cli/**'
      - 'scripts/**'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/check.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'apps/cli/**'
      - 'scripts/**'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Check existing Rust modules and foreign C ABI
        run: scripts/check
