name: Local zellij production owner

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-zellij-owner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  production-owner:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Exercise actual production child and foreground CLI owners
        run: python3 -B tools/local-zellij-feasibility/run-owner.py --output "$RUNNER_TEMP/local-zellij-owner"
      - name: Upload host evidence and pinned source notices
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-zellij-owner-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/local-zellij-owner/receipt.json
            ${{ runner.temp }}/local-zellij-owner/*.log
            tools/local-zellij-feasibility/pins.json
            tools/local-zellij-feasibility/NOTICE.md
            tools/local-zellij-feasibility/licenses/Zellij-LICENSE
            vendor/darwin-libproc/UPSTREAM.md
            vendor/darwin-libproc/LICENSE*
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 7
