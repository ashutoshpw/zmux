name: macOS development build

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Native validation suite
        type: choice
        options: [full, terminal-selection, completed-history, profile-operations, sidebar]
        default: full
        required: true
  push:
    branches: [main]
    paths:
      - 'apps/macos/**'
      - 'apps/cli/**'
      - 'config/deployment.json'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/**'
      - 'tools/native-fixtures/**'
      - 'tools/native-terminal-selection/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/macos-development.yml'

permissions:
  contents: read

concurrency:
  group: macos-development-${{ github.ref }}-${{ inputs.suite || 'full' }}
  cancel-in-progress: true

jobs:
  scheduler-linux:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: linux-x86_64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - key: linux-aarch64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Install native musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Install pinned Rust and native musl target
        env:
          SCHEDULER_TARGET: ${{ matrix.target }}
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target "$SCHEDULER_TARGET"
      - name: Build and validate native static-musl scheduler helper
        env:
          SCHEDULER_TARGET: ${{ matrix.target }}
        run: python3 -B scripts/build-remote-scheduler-linux --target "$SCHEDULER_TARGET" --output "$RUNNER_TEMP/remote-scheduler"
      - name: Retain native helper and manifest receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zmux-scheduler-${{ matrix.key }}-${{ github.sha }}
          path: ${{ runner.temp }}/remote-scheduler/${{ matrix.key }}
          if-no-files-found: error
          retention-days: 14

  swift-typecheck:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'full'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check scheduler queue layout before app builds
        run: scripts/check-scheduler-queue-layout
      - name: Retain scheduler queue layout evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zmux-scheduler-queue-layout-${{ github.sha }}
          path: dist/native-scheduler-queue-layout.*
          if-no-files-found: warn
          retention-days: 14
      - name: Type-check native sources independently of Rust builds
        run: scripts/check-macos-sources

  development:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'full'
    needs: [scheduler-linux, swift-typecheck]
    runs-on: macos-15
    # Cold universal builds plus native acceptance can exceed 25 minutes.
    timeout-minutes: 45
    steps:
      - name: Validate requested native suite
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_NATIVE_SUITE: ${{ inputs.suite || 'full' }}
        run: |
          if [ "$REQUESTED_NATIVE_SUITE" != full ]; then
            echo 'Unknown native validation suite' >&2
            exit 2
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Validate native terminal selection and link smoke inputs
        run: python3 -B tools/native-terminal-selection/run.py --check-inputs
      - name: Verify native persistence directory paths
        run: scripts/check-native-storage-paths
      - name: Verify native cloud credentials, device registration and encrypted terminal relay
        run: scripts/check-native-cloud-client --baseline-ref c25c4c631bb4917ee496f9caed39b42e843bb78d
      - name: Verify native authentication callbacks from foreign queues
        run: scripts/check-native-cloud-auth-callback --baseline-ref 380c6f7f218ae83b1c64e33954caa99554f94ca8
      - name: Check Swift fixture cleanup boundary
        run: scripts/check-swift-fixture-cleanup
      - name: Verify native browser download file ownership
        run: scripts/check-browser-download-files
      - name: Verify file tab close decision and Don't Save settling
        run: scripts/check-file-close-resolution
      - name: Verify file editor dirty, save, reload and banner decisions
        run: scripts/check-file-editor-model
      - name: Verify file load gate, queueing and busy retry
        run: scripts/check-file-load-gate
      - name: Install pinned Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Download same-source native Linux scheduler helpers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: zmux-scheduler-linux-x86_64-${{ github.sha }}
          path: dist/remote-scheduler-inputs/linux-x86_64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: zmux-scheduler-linux-aarch64-${{ github.sha }}
          path: dist/remote-scheduler-inputs/linux-aarch64
      - name: Restore downloaded scheduler helper executable bits
        run: chmod 755 dist/remote-scheduler-inputs/linux-x86_64/zmux-scheduler dist/remote-scheduler-inputs/linux-aarch64/zmux-scheduler
      - name: Install isolated tmux fixture dependency
        run: |
          if ! command -v tmux >/dev/null; then brew install tmux; fi
          tmux -V
      - name: Validate Rust core and foreign ABI
        env:
          RUST_TEST_THREADS: 2
        run: scripts/check
      - name: Build universal native development app
        run: scripts/build-macos-dev --scheduler-artifacts-root dist/remote-scheduler-inputs --require-full-scheduler
      - name: Retain testable candidate before native acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zmux-macos-candidate-universal-${{ github.sha }}
          path: |
            dist/zmux-dev-universal-*.zip
            dist/zmux-dev-universal-*.zip.sha256
            dist/build-info.json
          if-no-files-found: error
          retention-days: 14
      - name: Exercise terminal selection and browser links in the universal app
        run: python3 -B tools/native-terminal-selection/run.py --skip-build --output dist/native-terminal-selection-universal
      - name: Exercise packaged app and native rendering
        run: scripts/check-macos-app --skip-accessibility-save-tests
      - name: Exercise native sidebar and system status menu
        run: scripts/check-native-sidebar --skip-build
      - name: Upload downloadable development build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zmux-macos-dev-universal-${{ github.sha }}
          path: |
            dist/zmux-dev-universal-*.zip
            dist/zmux-dev-universal-*.zip.sha256
            dist/build-info.json
            dist/native-smoke.json
            dist/native-smoke.json.stages.json
            dist/native-cloud-terminal-lifecycle.json
            dist/native-cloud-terminal-lifecycle.stdout.log
            dist/native-cloud-terminal-lifecycle.stderr.log
            dist/native-cloud-terminal-fixture.json
            dist/native-download-preflight.log
            dist/native-windows.json
            dist/native-resources.json
            dist/Zmux-native-smoke.png
            dist/Zmux-native-window.png
            dist/zmux-ssh-reconnect.png
            dist/zmux-browser-smoke.png
            dist/zmux-workspace-drag.png
            dist/zmux-local-tmux-smoke.png
            dist/zmux-scheduled-messages.png
            dist/native-schedule-messages-smoke.json
            dist/native-schedule-messages-smoke.stdout.log
            dist/native-schedule-messages-smoke.stderr.log
            dist/native-sidebar*.json
            dist/native-sidebar*.log
            dist/native-status-menu.json
            dist/zmux-sidebar*.png
            dist/zmux-status-icon.png
            dist/native-terminal-selection-universal/receipt.json
            dist/native-terminal-selection-universal/native-selection.json
            dist/native-terminal-selection-universal/pointer*-child.json
            dist/native-terminal-selection-universal/child.json
            dist/native-terminal-selection-universal/wrap-child.json
            dist/native-terminal-selection-universal/copy-child-*.json
            dist/native-terminal-selection-universal/selection-child.py
            dist/native-terminal-selection-universal/*.log
            dist/native-terminal-selection-universal/source/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Zmux-native-diagnostics-${{ github.sha }}
          path: |
            dist/zmux-dev-universal-*.zip
            dist/zmux-dev-universal-*.zip.sha256
            dist/build-info.json
            dist/native-*.log
            dist/native-window-*.json
            dist/native-smoke.json
            dist/native-smoke.json.stages.json
            dist/native-cloud-terminal-lifecycle.json
            dist/native-cloud-terminal-lifecycle.stdout.log
            dist/native-cloud-terminal-lifecycle.stderr.log
            dist/native-cloud-terminal-fixture.json
            dist/native-download-preflight.log
            dist/native-windows.json
            dist/native-resources.json
            dist/native-failure-process.json
            dist/Zmux-native-smoke.png
            dist/Zmux-native-window.png
            dist/zmux-ssh-reconnect.png
            dist/zmux-browser-smoke.png
            dist/zmux-workspace-drag.png
            dist/zmux-local-tmux-smoke.png
            dist/zmux-scheduled-messages.png
            dist/native-schedule-messages-smoke.json
            dist/native-schedule-messages-smoke.stdout.log
            dist/native-schedule-messages-smoke.stderr.log
            dist/native-sidebar*.json
            dist/native-sidebar*.log
            dist/native-status-menu.json
            dist/zmux-sidebar*.png
            dist/zmux-status-icon.png
            dist/native-terminal-selection-universal/receipt.json
            dist/native-terminal-selection-universal/native-selection.json
            dist/native-terminal-selection-universal/*.log
            dist/native-terminal-selection-universal/source/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Build receipt
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          metadata = json.loads(Path('dist/build-info.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Download **zmux-macos-dev-universal-{metadata['source_sha']}** from this run's Artifacts.\n\n")
              summary.write('Universal arm64/x86_64 development app for macOS 14+. Ad-hoc signed; not notarized.\n')
          PY

  terminal-selection:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'terminal-selection'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install pinned host Rust
        run: rustup toolchain install 1.95.0 --profile minimal --target aarch64-apple-darwin
      - name: Validate finite selection inputs
        run: python3 -B tools/native-terminal-selection/run.py --check-inputs
      - name: Build host app and exercise actual terminal selection
        run: python3 -B tools/native-terminal-selection/run.py --output "$RUNNER_TEMP/native-terminal-selection"
      - name: Retain exact sources, public word reference and native result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-terminal-selection-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-terminal-selection/receipt.json
            ${{ runner.temp }}/native-terminal-selection/native-selection.json
            ${{ runner.temp }}/native-terminal-selection/pointer*-child.json
            ${{ runner.temp }}/native-terminal-selection/child.json
            ${{ runner.temp }}/native-terminal-selection/wrap-child.json
            ${{ runner.temp }}/native-terminal-selection/copy-child-*.json
            ${{ runner.temp }}/native-terminal-selection/selection-child.py
            ${{ runner.temp }}/native-terminal-selection/*.log
            ${{ runner.temp }}/native-terminal-selection/*.zip
            ${{ runner.temp }}/native-terminal-selection/source/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  completed-history:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'completed-history'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install pinned host Rust
        run: rustup toolchain install 1.95.0 --profile minimal --target aarch64-apple-darwin
      - name: Validate saved-history fixture inputs
        run: python3 -B tools/native-completed-history/run.py --check-inputs
      - name: Build host app and exercise restored saved output
        run: python3 -B tools/native-completed-history/run.py --output "$RUNNER_TEMP/native-completed-history"
      - name: Retain exact sources and native history evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-completed-history-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-completed-history/receipt.json
            ${{ runner.temp }}/native-completed-history/scenarios/*/*.json
            ${{ runner.temp }}/native-completed-history/scenarios/*/*.txt
            ${{ runner.temp }}/native-completed-history/scenarios/*/*.log
            ${{ runner.temp }}/native-completed-history/scenarios/*/*.py
            ${{ runner.temp }}/native-completed-history/*.log
            ${{ runner.temp }}/native-completed-history/*.zip
            ${{ runner.temp }}/native-completed-history/source/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  profile-operations:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'profile-operations'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Type-check both native source slices before build or execution
        run: scripts/check-macos-sources
      - name: Install pinned Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Verify portable owner and foreign ABI
        run: |
          if ! command -v tmux >/dev/null; then brew install tmux; fi
          scripts/check
      - name: Build universal packaged app
        run: scripts/build-macos-dev
      - name: Exercise production profiles and original process shutdown
        run: scripts/check-native-profile-operations
      - name: Retain package, exact fixture sources and partial evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-profile-operations-${{ github.sha }}
          include-hidden-files: true
          path: |
            dist/zmux-dev-universal-*.zip
            dist/zmux-dev-universal-*.zip.sha256
            dist/build-info.json
            dist/native-profile-operations.json
            dist/native-profiles-*
            apps/macos/Sources/
            crates/desktop-runtime/src/
            crates/native-bridge/src/
            crates/native-bridge/include/zmux.h
            apps/cli/src/
            scripts/check-native-profile-operations
            scripts/check-macos-sources
            scripts/build-macos-dev
            tools/native-fixtures/profile-lease-holder.c
          if-no-files-found: warn
          retention-days: 7

  sidebar:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'sidebar'
    runs-on: macos-15
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Type-check both native architecture slices
        run: scripts/check-macos-sources
      - name: Install pinned Rust
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Restore exact universal Rust build cache
        id: sidebar-rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: sidebar-rust-v1-${{ runner.os }}-${{ runner.arch }}-xcode16.4-rust1.95.0-macos14-universal-release-default-${{ hashFiles('**/Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'crates/**/*.rs', 'apps/cli/**/*.rs', 'vendor/**/*.rs', 'crates/**/*.c', 'crates/**/*.h', 'scripts/build-macos-dev') }}
      - name: Build packaged app for runner architecture
        id: sidebar-build
        run: scripts/build-macos-dev --architecture host
      - name: Exercise sidebar, system status menu, notifications and physical shutdown
        run: scripts/check-native-sidebar --skip-build --architecture host
      - name: Save successful Rust build even when native acceptance fails
        if: always() && !cancelled() && steps.sidebar-build.outcome == 'success' && steps.sidebar-rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.sidebar-rust-cache.outputs.cache-primary-key }}
      - name: Retain validated runner package and native evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zmux-native-sidebar-${{ github.sha }}
          path: |
            dist/zmux-dev-*.zip
            dist/zmux-dev-*.zip.sha256
            dist/build-info.json
            dist/native-sidebar*.json
            dist/native-sidebar*.log
            dist/zmux-sidebar*.png
            dist/native-status-menu.json
            dist/zmux-status-icon.png
          if-no-files-found: error
          retention-days: 14
      - name: Retain diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zmux-native-sidebar-diagnostics-${{ github.sha }}
          path: |
            dist/build-info.json
            dist/native-sidebar*.json
            dist/native-sidebar*.log
            dist/zmux-sidebar*.png
            dist/native-status-menu.json
            dist/zmux-status-icon.png
          if-no-files-found: ignore
          retention-days: 7
