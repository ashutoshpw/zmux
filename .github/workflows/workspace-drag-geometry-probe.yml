name: Workspace drag geometry probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Compile strict Swift 6 AppKit geometry probe
        run: |
          mkdir -p dist
          cat > dist/workspace-drag-geometry-probe.swift <<'SWIFT'
          import AppKit
          import Darwin
          import Foundation

          @MainActor
          final class FlippedDocumentView: NSView {
              override var isFlipped: Bool { true }
          }

          private struct RectRecord: Encodable {
              let x: Double
              let y: Double
              let width: Double
              let height: Double

              init(_ rect: NSRect) {
                  x = Double(rect.origin.x)
                  y = Double(rect.origin.y)
                  width = Double(rect.size.width)
                  height = Double(rect.size.height)
              }
          }

          private struct Measurement: Encodable {
              let stage: String
              let windowFrame: RectRecord
              let contentBounds: RectRecord
              let sidebarFrame: RectRecord
              let viewportFrame: RectRecord
              let clipBounds: RectRecord
              let documentFrame: RectRecord
              let overflow: Double
          }

          private struct ProbeReport: Encodable {
              let workflowSHA: String?
              let minimumHeightBefore: Measurement
              let minimumHeightAfterScrollAttempt: Measurement
              let reducedHeightBeforeScroll: Measurement
              let reducedHeightAfterScroll: Measurement
              let checks: [String: Bool]
          }

          @MainActor
          private enum Probe {
              static func run() throws {
                  let application = NSApplication.shared
                  _ = application.setActivationPolicy(.accessory)

                  let minimum = NSSize(width: 680, height: 420)
                  let window = NSWindow(
                      contentRect: NSRect(origin: .zero, size: minimum),
                      styleMask: [.titled, .closable, .miniaturizable, .resizable, .fullSizeContentView],
                      backing: .buffered,
                      defer: false
                  )
                  window.titleVisibility = .hidden
                  window.titlebarAppearsTransparent = true
                  window.isReleasedWhenClosed = false
                  window.minSize = minimum
                  window.setContentSize(minimum)

                  let originalFrame = window.frame
                  let originalMinimum = window.minSize
                  defer {
                      window.minSize = NSSize(width: originalMinimum.width, height: 180)
                      window.setFrame(originalFrame, display: false)
                      window.minSize = originalMinimum
                      window.orderOut(nil)
                      window.close()
                  }

                  let content = NSView(frame: .zero)
                  window.contentView = content

                  let sidebar = NSView(frame: .zero)
                  let header = NSView(frame: .zero)
                  let footer = NSView(frame: .zero)
                  let scroll = NSScrollView(frame: .zero)
                  let views: [NSView] = [sidebar, header, footer, scroll]
                  for view in views {
                      view.translatesAutoresizingMaskIntoConstraints = false
                  }
                  scroll.drawsBackground = false
                  scroll.borderType = .noBorder
                  scroll.hasVerticalScroller = true
                  scroll.hasHorizontalScroller = false
                  scroll.autohidesScrollers = true
                  content.addSubview(sidebar)
                  sidebar.addSubview(header)
                  sidebar.addSubview(footer)
                  sidebar.addSubview(scroll)

                  NSLayoutConstraint.activate([
                      sidebar.leadingAnchor.constraint(equalTo: content.leadingAnchor),
                      sidebar.topAnchor.constraint(equalTo: content.topAnchor),
                      sidebar.bottomAnchor.constraint(equalTo: content.bottomAnchor),
                      sidebar.widthAnchor.constraint(equalToConstant: 224),

                      header.leadingAnchor.constraint(equalTo: sidebar.leadingAnchor),
                      header.trailingAnchor.constraint(equalTo: sidebar.trailingAnchor),
                      header.topAnchor.constraint(equalTo: content.topAnchor),
                      header.heightAnchor.constraint(equalToConstant: 32),

                      scroll.leadingAnchor.constraint(equalTo: sidebar.leadingAnchor),
                      scroll.trailingAnchor.constraint(equalTo: sidebar.trailingAnchor),
                      scroll.topAnchor.constraint(equalTo: header.bottomAnchor, constant: 4),
                      scroll.bottomAnchor.constraint(equalTo: footer.topAnchor),

                      footer.leadingAnchor.constraint(equalTo: sidebar.leadingAnchor),
                      footer.trailingAnchor.constraint(equalTo: sidebar.trailingAnchor),
                      footer.bottomAnchor.constraint(equalTo: sidebar.bottomAnchor),
                      footer.heightAnchor.constraint(equalToConstant: 54)
                  ])

                  let document = FlippedDocumentView(frame: .zero)
                  document.translatesAutoresizingMaskIntoConstraints = false
                  scroll.documentView = document
                  NSLayoutConstraint.activate([
                      document.leadingAnchor.constraint(equalTo: scroll.contentView.leadingAnchor),
                      document.topAnchor.constraint(equalTo: scroll.contentView.topAnchor),
                      document.widthAnchor.constraint(equalTo: scroll.contentView.widthAnchor),
                      document.heightAnchor.constraint(equalToConstant: 192)
                  ])

                  window.center()
                  window.makeKeyAndOrderFront(nil)
                  settle(window: window, content: content, scroll: scroll, document: document)
                  let minimumBefore = measure("minimum-before-scroll", window, content, sidebar, scroll, document)
                  scroll.contentView.scroll(to: NSPoint(
                      x: minimumBefore.clipBounds.x,
                      y: minimumBefore.clipBounds.y + 8
                  ))
                  scroll.reflectScrolledClipView(scroll.contentView)
                  settle(window: window, content: content, scroll: scroll, document: document)
                  let minimumAfter = measure("minimum-after-scroll-attempt", window, content, sidebar, scroll, document)

                  window.minSize = NSSize(width: originalMinimum.width, height: 180)
                  window.setContentSize(NSSize(width: content.bounds.width, height: 260))
                  settle(window: window, content: content, scroll: scroll, document: document)
                  let reducedBefore = measure("reduced-before-scroll", window, content, sidebar, scroll, document)
                  scroll.contentView.scroll(to: NSPoint(
                      x: reducedBefore.clipBounds.x,
                      y: reducedBefore.clipBounds.y + 8
                  ))
                  scroll.reflectScrolledClipView(scroll.contentView)
                  settle(window: window, content: content, scroll: scroll, document: document)
                  let reducedAfter = measure("reduced-after-scroll", window, content, sidebar, scroll, document)

                  let checks = [
                      "document_fits_at_minimum_height": minimumBefore.overflow <= 0.5,
                      "scroll_is_clamped_when_document_fits": abs(minimumAfter.clipBounds.y - minimumBefore.clipBounds.y) <= 0.5,
                      "document_overflows_after_resize": reducedBefore.overflow > 0.5,
                      "scroll_origin_moves_when_document_overflows": reducedAfter.clipBounds.y > reducedBefore.clipBounds.y + 0.5,
                      "scroll_origin_is_positive_after_overflow": reducedAfter.clipBounds.y > 0.5
                  ]
                  let report = ProbeReport(
                      workflowSHA: ProcessInfo.processInfo.environment["GITHUB_SHA"],
                      minimumHeightBefore: minimumBefore,
                      minimumHeightAfterScrollAttempt: minimumAfter,
                      reducedHeightBeforeScroll: reducedBefore,
                      reducedHeightAfterScroll: reducedAfter,
                      checks: checks
                  )
                  let encoder = JSONEncoder()
                  encoder.outputFormatting = [.prettyPrinted, .sortedKeys]
                  let data = try encoder.encode(report)
                  let reportPath = CommandLine.arguments.dropFirst().first ?? "dist/workspace-drag-geometry.json"
                  let output = URL(fileURLWithPath: reportPath)
                  try data.write(to: output, options: .atomic)
                  print(String(decoding: data, as: UTF8.self))

                  let failures = checks.filter { !$0.value }.map(\.key).sorted()
                  guard failures.isEmpty else {
                      throw ProbeError.failed(failures)
                  }
              }

              private static func settle(window: NSWindow, content: NSView, scroll: NSScrollView, document: NSView) {
                  for _ in 0..<3 {
                      window.contentView?.layoutSubtreeIfNeeded()
                      content.layoutSubtreeIfNeeded()
                      scroll.layoutSubtreeIfNeeded()
                      scroll.contentView.layoutSubtreeIfNeeded()
                      document.layoutSubtreeIfNeeded()
                      window.displayIfNeeded()
                      RunLoop.main.run(until: Date(timeIntervalSinceNow: 0.02))
                  }
              }

              private static func measure(
                  _ stage: String,
                  _ window: NSWindow,
                  _ content: NSView,
                  _ sidebar: NSView,
                  _ scroll: NSScrollView,
                  _ document: NSView
              ) -> Measurement {
                  let clipBounds = scroll.contentView.bounds
                  let documentFrame = document.frame
                  return Measurement(
                      stage: stage,
                      windowFrame: RectRecord(window.frame),
                      contentBounds: RectRecord(content.bounds),
                      sidebarFrame: RectRecord(sidebar.frame),
                      viewportFrame: RectRecord(scroll.frame),
                      clipBounds: RectRecord(clipBounds),
                      documentFrame: RectRecord(documentFrame),
                      overflow: Double(documentFrame.height - clipBounds.height)
                  )
              }
          }

          private enum ProbeError: Error, CustomStringConvertible {
              case failed([String])

              var description: String {
                  switch self {
                  case .failed(let checks):
                      return "Geometry checks failed: \(checks.joined(separator: ", "))"
                  }
              }
          }

          @main
          struct WorkspaceDragGeometryProbe {
              @MainActor
              static func main() {
                  do {
                      try Probe.run()
                  } catch {
                      FileHandle.standardError.write(Data("\(error)\n".utf8))
                      Darwin.exit(EXIT_FAILURE)
                  }
              }
          }
          SWIFT
          xcrun swiftc -parse-as-library -typecheck -swift-version 6 -strict-concurrency=complete -warnings-as-errors -framework AppKit dist/workspace-drag-geometry-probe.swift
          xcrun swiftc -parse-as-library -swift-version 6 -strict-concurrency=complete -warnings-as-errors -framework AppKit dist/workspace-drag-geometry-probe.swift -o dist/workspace-drag-geometry-probe
      - name: Run AppKit geometry probe with a finite deadline
        run: |
          python3 - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          stdout = Path("dist/workspace-drag-geometry.stdout.log")
          stderr = Path("dist/workspace-drag-geometry.stderr.log")
          with stdout.open("wb") as output, stderr.open("wb") as errors:
              try:
                  result = subprocess.run(
                      ["dist/workspace-drag-geometry-probe", "dist/workspace-drag-geometry.json"],
                      stdout=output,
                      stderr=errors,
                      timeout=30,
                      check=False,
                  )
              except subprocess.TimeoutExpired:
                  result = None

          if stdout.exists():
              print(stdout.read_text())
          if stderr.exists():
              print(stderr.read_text(), file=sys.stderr)
          report = Path("dist/workspace-drag-geometry.json")
          if report.exists():
              print(report.read_text())
          if result is None:
              raise SystemExit("AppKit geometry probe timed out after 30 seconds")
          raise SystemExit(result.returncode)
          PY
      - name: Retain probe source, geometry JSON, and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace-drag-geometry-${{ github.sha }}
          path: |
            dist/workspace-drag-geometry-probe.swift
            dist/workspace-drag-geometry.json
            dist/workspace-drag-geometry*.log
          if-no-files-found: warn
          retention-days: 7
