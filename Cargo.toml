[workspace]
resolver = "3"
members = ["crates/workspace-core", "crates/terminal-adapter", "crates/session-runtime", "crates/session-runtime/test-support", "apps/cli", "crates/native-bridge", "crates/desktop-runtime", "crates/remote-runtime", "crates/ghostty-vt"]
exclude = ["vendor/darwin-libproc", "vendor/vt100"]

[patch.crates-io]
darwin-libproc = { path = "vendor/darwin-libproc" }
vt100 = { path = "vendor/vt100" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/ashutoshpw/zmux"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
subtle = "=2.6.1"
uuid = { version = "1", default-features = false, features = ["std", "serde", "v5"] }
portable-pty = "=0.9.0"
vt100 = "=0.16.2"
filedescriptor = "=0.8.3"
socket2 = { version = "=0.6.3", features = ["all"] }
nix = { version = "0.28", features = ["signal", "process"] }
rustix = { version = "=1.1.5", features = ["process"] }
signal-hook = { version = "=0.4.5", default-features = false, features = ["iterator"] }
sha2 = "=0.10.9"
url = "=2.5.8"
zmux-terminal-adapter = { path = "crates/terminal-adapter" }
zmux-session-runtime = { path = "crates/session-runtime" }
zmux-desktop-runtime = { path = "crates/desktop-runtime" }
zmux-workspace-core = { path = "crates/workspace-core" }
zmux-remote-runtime = { path = "crates/remote-runtime" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
