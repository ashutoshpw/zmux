[workspace]
resolver = "3"
members = ["crates/workspace-core", "crates/terminal-adapter", "crates/session-runtime", "apps/cli", "crates/native-bridge", "crates/desktop-runtime"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/ashutoshpw/zmux"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
portable-pty = "=0.9.0"
vt100 = "=0.16.2"
filedescriptor = "=0.8.3"
nix = { version = "0.28", features = ["signal", "process"] }
zmux-terminal-adapter = { path = "crates/terminal-adapter" }
zmux-session-runtime = { path = "crates/session-runtime" }
zmux-desktop-runtime = { path = "crates/desktop-runtime" }
zmux-workspace-core = { path = "crates/workspace-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
